[project]
name = "pmrewards"
version = "0.1.0"
description = "Continuous archive of Polymarket liquidity-reward configurations, which the API drops once a market closes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thibautdqb" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.scripts]
pmrewards = "pmrewards.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
